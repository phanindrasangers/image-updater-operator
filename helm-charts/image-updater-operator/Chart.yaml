apiVersion: v2
name: image-updater-operator
description: |
  A Kubernetes operator that keeps workload container images up to date by
  watching external registries. It patches workloads in place or commits the
  change to Git for a GitOps controller to sync.
type: application
version: 0.2.0
appVersion: "0.2.0"
keywords:
  - image-updater
  - gitops
  - operator
  - registry
home: https://github.com/phanindrasangers/image-updater-operator
sources:
  - https://github.com/phanindrasangers/image-updater-operator
maintainers:
  - name: phanindrasangers
    url: https://github.com/phanindrasangers
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "true"
  artifacthub.io/operatorCapabilities: Basic Install
  artifacthub.io/links: |
    - name: source
      url: https://github.com/phanindrasangers/image-updater-operator
    - name: documentation
      url: https://phanindrasangers.github.io/image-updater-operator
  artifacthub.io/images: |
    - name: manager
      image: ghcr.io/phanindrasangers/image-updater-operator:0.2.0
  artifacthub.io/changes: |
    - kind: added
      description: Customizable Git write-back commit message and author
    - kind: added
      description: Optional Service for the monitoring dashboard
    - kind: changed
      description: Scan once per interval with clear per-update logs
    - kind: fixed
      description: Skip controller-owned workloads to avoid duplicate write-back
