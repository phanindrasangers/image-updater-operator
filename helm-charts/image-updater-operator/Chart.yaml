apiVersion: v2
name: image-updater-operator
description: |
  A Kubernetes operator that keeps workload container images up to date by
  watching external registries. It patches workloads in place or commits the
  change to Git for a GitOps controller to sync.
type: application
version: 0.2.0
appVersion: "0.2.0"
keywords:
  - image-updater
  - gitops
  - operator
  - registry
home: https://github.com/saphire/image-updater-operator
sources:
  - https://github.com/saphire/image-updater-operator
maintainers:
  - name: Saphire
